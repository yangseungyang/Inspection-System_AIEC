;--------------------------------------------------------------------------------------------------
;[Common]ｾｸｼｮﾝ                  共通情報
;---------------------------+--------+------+------------------------------------------------------
; ｷｰ名                      | 型     | 変更 | 説明
;---------------------------+--------+------+------------------------------------------------------
; Connection_PortMax        | 数値   | ×   | 通信ｻｰﾊﾞでｻﾎﾟｰﾄするﾎﾟｰﾄ総数
; Connection_AppMax         | 数値   | ×   | 同一ﾎﾟｰﾄに接続可能なｱﾌﾟﾘｹｰｼｮﾝ数
;--------------------------------------------------------------------------------------------------
[Common]
Connection_PortMax=16
Connection_AppMax=32

;--------------------------------------------------------------------------------------------------
;[COMM]ｾｸｼｮﾝ                    接続情報
;---------------------------+--------+------+------------------------------------------------------
; ｷｰ名                      | 型     | 変更 | 説明
;---------------------------+--------+------+------------------------------------------------------
; Seamless                  | 数値   | ×   | ｼｰﾑﾚｽ接続機能
;                           |        |      |   0:使用しない  1:使用する
;--------------------------------------------------------------------------------------------------
[COMM]
Seamless=0


;--------------------------------------------------------------------------------------------------
;[PORTn]ｾｸｼｮﾝ                  [ﾎﾟｰﾄn]通信設定情報
;---------------------------+--------+------+------------------------------------------------------
; ｷｰ名                      | 型     | 変更 | 説明
;---------------------------+--------+------+------------------------------------------------------
; Media                     | 数値   | ○   | 通信媒体
;                           |        |      |   0:RS-232C  1:ﾓﾃﾞﾑ  2:Ethernet  3:FL-net  4:USB
; Seamless                  | 数値   | ○   | ｼｰﾑﾚｽ接続
;                           |        |      |   0:通常接続  1:ｼｰﾑﾚｽ接続
; RS_Connect                | 数値   | ○   | RS-232C接続方法
;                           |        |      |   0:自動  1:固定
; RS_ConInfo                | 数値   | ○   | RS-232C固定時の通信情報
;                           |        |      |   0:  9600bpsﾊﾟﾘﾃｨ偶数  1:  9600bpsﾊﾟﾘﾃｨなし
;                           |        |      |   2: 19200bpsﾊﾟﾘﾃｨ偶数  3: 19200bpsﾊﾟﾘﾃｨなし
;                           |        |      |   4: 38400bpsﾊﾟﾘﾃｨ偶数  5: 38400bpsﾊﾟﾘﾃｨなし
;                           |        |      |   6: 57600bpsﾊﾟﾘﾃｨ偶数  7: 57600bpsﾊﾟﾘﾃｨなし
;                           |        |      |   8:115200bpsﾊﾟﾘﾃｨ偶数  9:115200bpsﾊﾟﾘﾃｨなし
; RS_TimeOut                | 数値   | ○   | 通信ﾀｲﾑｱｳﾄ時間
;                           |        |      |   1～100(秒)
; RS_Retry                  | 数値   | ○   | ﾘﾄﾗｲ回数
;                           |        |      |   0～100(回)
; RS_ComPort                | 数値   | ○   | COMﾎﾟｰﾄ番号
;                           |        |      |   1～100
; RS_TelNo                  | 文字列 | ○   | 次期F2-14 2008.04.26 Tabira@ITS  Start モデム設定機能の改良
;                           |        |      | (新)ﾓﾃﾞﾑ使用時のﾀﾞｲﾔﾙｱｯﾌﾟ接続名	<- (旧)ﾓﾃﾞﾑ使用時の電話番号
;                           |        |      |   (新)最大255文字の文字列   		<- (旧)最大35文字の半角数字文字列
; RS_TonePls                | 数値   | ○   | 次期F2-14 2008.04.26 Tabira@ITS  Start モデム設定機能の改良
;                           |        |      | (新)未使用	<- (旧)回線種類
;                           |        |      |   0:ﾄｰﾝ  1:ﾊﾟﾙｽ
; RS_ComInfoMax             | 数値   | ×   | 通信ﾓｰﾄﾞの最大数
;							|		 |		|// 2008/06/03 通信サーバEX質問_080527.xls #21
;                           |        |      |   3 or 9	-> 4 or 10
; EN_Target                 | 文字列 | ○   | 相手先IPｱﾄﾞﾚｽ/ﾎｽﾄ名
; EN_CpuNo                  | 数値   | ○   | 相手先CPU番号
;                           |        |      |   1～4
; EN_TimeOut                | 数値   | ○   | ｺﾈｸｼｮﾝﾀｲﾑｱｳﾄ時間
;                           |        |      |   1～100(秒)
; FL_TargetNode             | 数値   | ○   | 接続先ﾉｰﾄﾞ番号
;                           |        |      |   1～254
; FL_CpuNo                  | 数値   | ○   | 相手先CPU番号
;                           |        |      |   1～4
; FL_EnableLocalIP          | 数値   | ○   | ﾊﾟｿｺﾝのﾈｯﾄﾜｰｸｶｰﾄﾞの指定
;                           |        |      |   0:指定しない  1:指定する
; FL_LocalIP                | 文字列 | ○   | ﾛｰｶﾙIPｱﾄﾞﾚｽ
;                           |        |      |   0.0.0.1～255.255.255.254
; FL_EnableLocalNode        | 数値   | ○   | ﾊﾟｿｺﾝのﾉｰﾄﾞ番号の指定
;                           |        |      |   0:指定しない  1:指定する
; FL_LocalNode              | 数値   | ○   | 自ﾉｰﾄﾞ番号
;                           |        |      |   1～254
; USB_Vendor                | 文字列 | ×   | ﾍﾞﾝﾀﾞｺｰﾄﾞ設定ﾌｧｲﾙ名
;                           |        |      |   256文字以内
; USB_TimeOut               | 数値   | ○   | USBﾀｲﾑｱｳﾄ時間(未使用)
;                           |        |      |   10
; USB_CpuNo                 | 数値   | ○   | 相手先CPU番号
;                           |        |      |   0:ｹｰﾌﾞﾙ接続先  1～4:相手先CPU番号
; SL_GatewaySlot            | 数値   | ○   | ｼｰﾑﾚｽ接続 ｹﾞｰﾄｳｪｲﾕﾆｯﾄのFL-netﾓｼﾞｭｰﾙｽﾛｯﾄ番号
;                           |        |      |   1～16
; SL_TargetNode             | 数値   | ○   | ｼｰﾑﾚｽ接続 ﾀｰｹﾞｯﾄﾕﾆｯﾄのFL-netﾉｰﾄﾞ番号
;                           |        |      |   1～254
; SL_TargetCpu              | 数値   | ○   | ｼｰﾑﾚｽ接続 ﾀｰｹﾞｯﾄﾕﾆｯﾄのCPU番号
;                           |        |      |   1～4
;--------------------------------------------------------------------------------------------------
