'------------------------------------------------------------------------------------------------
'   設定ファイル
'   DEVICEx:  0 = GPIB
'             1 = RS232C
'             2 = USB
'             3 = ETHER
'
'   PARAMx    制御対象デバイスのGPIBアドレスや、RS232の設定値を文字列として設定します。
'               GPIB : PARAMx = 1～30 (デバイスのGPIBアドレス値)
'               RS232: PARAMx = ポート番号,ボーレート番号,ビット仕様,ハンドシェーク番号
'                   ポート番号      0 = COM1, 1 = COM2, 2 = COM3
'                   ボーレート番号  0 = 1200, 1 = 2400, 2 = 4800, 3 = 9600, 4 = 19200, 5 = 38400, 6 = 57600
'                   ビット仕様      0 = 8Bit&NoP&1StopBit, 1 = 7Bit&Even&1StopBit, 2 = 7Bit&Odd&1StopBit
'                   ハンドシェーク番号   0 = NO-NO, 1 = XON-XON, 2 = CTS-RTS
'               USB: adr = 1～127 (デバイスのUSB識別ID値)
'               Ethernet: PARAMx = サーバ名,ユーザ名,パスワード名
'                   サーバ名              サーバ名、またはIPアドレス
'                   ユーザ名              ユーザ名
'                   パスワード            パスワード
'                   ユーザ名がanonymousの時は、パスワードは必要ありません。
'             (区切りのための、","カンマは必要です)
'
'   TERMx(terminator):
'               0 = CRLF
'               1 = CR
'               2 = LF
'               3 = EOI
'
'   ※x=識別ID(0･･･)
'          
'------------------------------------------------------------------------------------------------
<DEVICE1>
0
<PARAM1>
1
<TERM1>
3